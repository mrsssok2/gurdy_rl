gurdy:
  # Publish all joint states -----------------------------------
  joint_state_controller:
    type: joint_state_controller/JointStateController
    publish_rate: 50
  
  # Position Controllers ---------------------------------------
  # Output is joint torque in N*m: p * error(rad) + i * integral + d * error rate.
  # Current gains (tune here):
  #   all 12 joints: p=10.0  i=0.5  d=0.05
  # p=20 d=1.0 oscillated with the old 0.01 kg links; these moderate gains go
  # with the realistic masses and joint damping in robot/gurdy.xacro. p=10
  # reaches the 3.0 N*m effort limit at ~0.3 rad of error.
  # d is 0.05, not 0.3: at a 1 ms physics step a D gain is only stable while
  # d*dt/I < 2. With the legs folded at GROUND_OUT the knee's inertia is
  # ~7.4e-5 kg m^2 and the hip's ~1.8e-4 (knee free) to ~2.6e-4 (knee rigid),
  # so d=0.3 broke the limit at the knee and sat at or past it at the hip;
  # both chattered at 20-40 rad/s. At 0.05 the knee is at 0.68 and the hip
  # at <=0.33 in every foot pose. Physical joint damping (joint_damping in
  # robot/gurdy.xacro, applied implicitly) does most of the damping instead.
  # i_clamp limits the integral term to +/-0.1 N*m so it cannot wind up while a
  # joint is blocked (e.g. a foot pressed into the ground or a joint at its
  # limit) and then release as a large torque spike. Keep it well below the
  # joint effort limit in robot/gurdy.xacro. Set i to 0.0 to disable it.
  # Upper leg controllers
  head_upperlegM1_joint_position_controller:
    type: effort_controllers/JointPositionController
    joint: head_upperlegM1_joint
    pid: {p: 10.0, i: 0.5, d: 0.05, i_clamp: 0.1}

  head_upperlegM2_joint_position_controller:
    type: effort_controllers/JointPositionController
    joint: head_upperlegM2_joint
    pid: {p: 10.0, i: 0.5, d: 0.05, i_clamp: 0.1}

  head_upperlegM3_joint_position_controller:
    type: effort_controllers/JointPositionController
    joint: head_upperlegM3_joint
    pid: {p: 10.0, i: 0.5, d: 0.05, i_clamp: 0.1}

  head_upperlegM4_joint_position_controller:
    type: effort_controllers/JointPositionController
    joint: head_upperlegM4_joint
    pid: {p: 10.0, i: 0.5, d: 0.05, i_clamp: 0.1}

  head_upperlegM5_joint_position_controller:
    type: effort_controllers/JointPositionController
    joint: head_upperlegM5_joint
    pid: {p: 10.0, i: 0.5, d: 0.05, i_clamp: 0.1}

  head_upperlegM6_joint_position_controller:
    type: effort_controllers/JointPositionController
    joint: head_upperlegM6_joint
    pid: {p: 10.0, i: 0.5, d: 0.05, i_clamp: 0.1}

  # Lower leg controllers
  upperlegM1_lowerlegM1_joint_position_controller:
    type: effort_controllers/JointPositionController
    joint: upperlegM1_lowerlegM1_joint
    pid: {p: 10.0, i: 0.5, d: 0.05, i_clamp: 0.1}

  upperlegM2_lowerlegM2_joint_position_controller:
    type: effort_controllers/JointPositionController
    joint: upperlegM2_lowerlegM2_joint
    pid: {p: 10.0, i: 0.5, d: 0.05, i_clamp: 0.1}

  upperlegM3_lowerlegM3_joint_position_controller:
    type: effort_controllers/JointPositionController
    joint: upperlegM3_lowerlegM3_joint
    pid: {p: 10.0, i: 0.5, d: 0.05, i_clamp: 0.1}

  upperlegM4_lowerlegM4_joint_position_controller:
    type: effort_controllers/JointPositionController
    joint: upperlegM4_lowerlegM4_joint
    pid: {p: 10.0, i: 0.5, d: 0.05, i_clamp: 0.1}

  upperlegM5_lowerlegM5_joint_position_controller:
    type: effort_controllers/JointPositionController
    joint: upperlegM5_lowerlegM5_joint
    pid: {p: 10.0, i: 0.5, d: 0.05, i_clamp: 0.1}

  upperlegM6_lowerlegM6_joint_position_controller:
    type: effort_controllers/JointPositionController
    joint: upperlegM6_lowerlegM6_joint
    pid: {p: 10.0, i: 0.5, d: 0.05, i_clamp: 0.1}