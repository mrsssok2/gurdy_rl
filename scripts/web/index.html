<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gurdy Live</title>
<style>
  :root {
    --bg: #0a0e16;
    --panel: #121a28;
    --panel-2: #172133;
    --border: #233047;
    --text: #e8edf6;
    --muted: #8d9ab0;
    --faint: #5b6880;
    --grid: #233049;
    --grid-strong: #3a4b68;
    --green: #22c55e;
    --blue: #3b82f6;
    --amber: #f59e0b;
    --red: #ef4444;
    --purple: #a855f7;
    --slate: #64748b;
    --path: #60a5fa;
    --radius: 14px;
    --font: "Segoe UI", system-ui, -apple-system, Roboto, "Noto Sans", "Nirmala UI", sans-serif;
    --deva: "Nirmala UI", "Noto Sans Devanagari", "Mangal", "Lohit Devanagari", var(--font);
    --mono: "Cascadia Mono", "Consolas", "SFMono-Regular", "DejaVu Sans Mono", monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text); font-family: var(--font);
    font-size: 16px; -webkit-font-smoothing: antialiased;
  }
  .app {
    height: 100vh; display: grid; gap: 14px; padding: 14px 18px 16px;
    grid-template-rows: auto minmax(0, 1fr) auto;
  }

  /* --- header ------------------------------------------------------------ */
  header { display: flex; align-items: center; gap: 16px; }
  .brand { font-size: 26px; font-weight: 700; letter-spacing: .2px; }
  .brand span { color: var(--muted); font-weight: 500; }
  .spacer { flex: 1; }
  .pill {
    display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px;
    border-radius: 999px; background: var(--panel); border: 1px solid var(--border);
    color: var(--muted); font-size: 15px; font-variant-numeric: tabular-nums;
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--faint); }
  .live .dot { background: var(--green); box-shadow: 0 0 0 4px rgba(34,197,94,.18); }
  .down .dot { background: var(--red); }

  /* --- main row ---------------------------------------------------------- */
  .main {
    display: grid; gap: 14px; min-height: 0;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr) 420px;
  }
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    min-height: 0; min-width: 0; display: flex; flex-direction: column; overflow: hidden;
  }
  .card-head {
    display: flex; align-items: center; gap: 10px; padding: 12px 16px 0;
    font-size: 15px; font-weight: 600; color: var(--muted);
    text-transform: uppercase; letter-spacing: 1.2px;
  }
  .card-head .spacer { flex: 1; }
  .card-head button {
    font: inherit; font-size: 12px; letter-spacing: .8px; color: var(--muted);
    background: transparent; border: 1px solid var(--border); border-radius: 8px;
    padding: 4px 10px; cursor: pointer;
  }
  .card-head button:hover { color: var(--text); border-color: var(--faint); }
  .fill { position: relative; flex: 1; min-height: 0; margin: 10px 12px 12px; }
  #map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  .camera-box {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: #05080d; border-radius: 10px; overflow: hidden;
  }
  #cam { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
  .overlay {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    text-align: center; color: var(--muted); font-size: 18px; padding: 20px;
    pointer-events: none;
  }
  .overlay.warn {
    inset: auto 12px 12px auto; padding: 6px 12px; border-radius: 8px;
    background: rgba(239,68,68,.9); color: #fff; font-weight: 600; font-size: 15px;
  }
  .hidden { display: none !important; }

  /* --- status column ----------------------------------------------------- */
  .status-col { padding: 14px 16px 16px; gap: 12px; overflow-y: auto; }
  .status-badge {
    text-align: center; font-size: 40px; font-weight: 800; letter-spacing: 3px;
    padding: 14px 10px; border-radius: 12px; color: #fff; background: var(--slate);
  }
  .s-STANDING { background: var(--green); }
  .s-WALKING { background: var(--blue); }
  .s-STOPPED { background: var(--amber); color: #1a1205; }
  .s-FALLEN { background: var(--red); }
  .stats { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
  .stat {
    background: var(--panel-2); border-radius: 10px; padding: 9px 12px; min-width: 0;
  }
  .stat.wide { grid-column: span 2; }
  .label { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
  .value {
    font-family: var(--mono); font-size: 23px; font-weight: 600; margin-top: 2px;
    font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis;
  }
  .value small { font-size: 15px; color: var(--muted); font-weight: 500; }
  .bar { height: 8px; border-radius: 4px; background: var(--grid-strong); margin-top: 8px; overflow: hidden; }
  .bar > div { height: 100%; width: 0; background: var(--blue); border-radius: 4px; transition: width .15s; }
  .legs { display: flex; gap: 6px; margin-top: 6px; }
  .leg {
    flex: 1; text-align: center; padding: 5px 0; border-radius: 7px; font-weight: 700;
    font-size: 17px; background: var(--grid-strong); color: var(--faint);
  }
  .leg.up { background: var(--amber); color: #1a1205; }
  .text-row { background: var(--panel-2); border-radius: 10px; padding: 9px 12px; }
  .text-row .text {
    font-size: 18px; margin-top: 3px; line-height: 1.3; word-break: break-word;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }

  /* --- voice strip ------------------------------------------------------- */
  .voice {
    display: grid; gap: 14px; align-items: stretch;
    grid-template-columns: 250px 190px 300px minmax(0, 1fr) minmax(0, 1fr);
    height: 150px;
  }
  .big-btn {
    border: 0; border-radius: var(--radius); color: #fff; cursor: pointer;
    font: inherit; font-size: 34px; font-weight: 800; letter-spacing: 1px;
    display: flex; align-items: center; justify-content: center; gap: 14px;
    transition: transform .06s, filter .15s, box-shadow .15s;
  }
  .big-btn:hover { filter: brightness(1.12); }
  .big-btn:active, .big-btn.pressed { transform: scale(.97); }
  .big-btn:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  .big-btn svg { width: 38px; height: 38px; flex: none; }
  .big-btn .hint { display: block; font-size: 13px; font-weight: 500; opacity: .75; letter-spacing: .5px; }
  #speak { background: linear-gradient(160deg, #2563eb, #1d4ed8); box-shadow: 0 6px 24px rgba(37,99,235,.35); }
  #stop { background: linear-gradient(160deg, #ef4444, #dc2626); box-shadow: 0 6px 24px rgba(220,38,38,.35); }
  .voice .card { padding: 14px 16px; justify-content: center; gap: 8px; }
  .voice-badge {
    align-self: flex-start; font-size: 24px; font-weight: 800; letter-spacing: 1.5px;
    padding: 7px 14px; border-radius: 10px; color: #fff; background: var(--slate);
    white-space: nowrap;
  }
  .v-IDLE { background: var(--slate); }
  .v-LISTENING { background: var(--red); animation: pulse 1.1s ease-in-out infinite; }
  .v-THINKING { background: var(--amber); color: #1a1205; }
  .v-ROBOT_ACTING { background: var(--blue); }
  .v-SPEAKING { background: var(--green); }
  .v-WAITING_FOR_MIC { background: var(--purple); }
  .v-NO_VOICE_CLIENT, .v-VOICE_ { background: #4b5563; }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(239,68,68,.6); }
    50% { box-shadow: 0 0 0 10px rgba(239,68,68,0); }
  }
  .voice-detail { font-size: 14px; color: var(--muted); line-height: 1.3;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .big-text {
    font-size: 26px; line-height: 1.3; word-break: break-word;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  .deva { font-family: var(--deva); }
  .empty { color: var(--faint); }

  /* --- narrow screens: stack and scroll ---------------------------------- */
  @media (max-width: 1280px) {
    .app { height: auto; min-height: 100vh; }
    .main { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
    .main > .status-col { grid-column: span 2; }
    .main > .card:not(.status-col) { height: 460px; }
    .voice { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); height: auto; }
    .voice .big-btn { height: 110px; }
    .voice .card { min-height: 110px; }
    .voice > .card:last-child { grid-column: span 2; }
  }
  @media (max-width: 760px) {
    .app { padding: 12px 16px; }
    .main { grid-template-columns: minmax(0, 1fr); }
    .main > .status-col { grid-column: auto; }
    .main > .card:not(.status-col) { height: 340px; }
    .voice { grid-template-columns: minmax(0, 1fr); }
    .voice > .card:last-child { grid-column: auto; }
    header { flex-wrap: wrap; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">Gurdy <span>· live</span></div>
    <div class="spacer"></div>
    <div class="pill" id="simtime">sim t = –</div>
    <div class="pill down" id="conn"><span class="dot"></span><span id="conn-text">connecting…</span></div>
  </header>

  <section class="main">
    <div class="card">
      <div class="card-head">Top view <span class="spacer"></span>
        <button id="fit" title="Fit the map to the current path">Fit view</button></div>
      <div class="fill"><canvas id="map"></canvas></div>
    </div>

    <div class="card">
      <div class="card-head">Camera — what Gurdy sees</div>
      <div class="fill">
        <div class="camera-box">
          <img id="cam" alt="">
          <div class="overlay" id="cam-wait">waiting for /gurdy/camera/annotated</div>
          <div class="overlay warn hidden" id="cam-stale">no new frames</div>
        </div>
      </div>
    </div>

    <div class="card status-col">
      <div class="status-badge" id="status">–</div>
      <div class="stats">
        <div class="stat"><div class="label">x</div><div class="value" id="x">–</div></div>
        <div class="stat"><div class="label">y</div><div class="value" id="y">–</div></div>
        <div class="stat"><div class="label">Heading</div><div class="value" id="heading">–</div></div>
        <div class="stat"><div class="label">Mode</div><div class="value" id="mode">–</div></div>
        <div class="stat wide"><div class="label">This walk</div>
          <div class="value" id="walk">–</div><div class="bar"><div id="walk-bar"></div></div></div>
        <div class="stat"><div class="label">Total</div><div class="value" id="total">–</div></div>
        <div class="stat"><div class="label">Height</div><div class="value" id="height">–</div></div>
        <div class="stat wide"><div class="label">Roll / pitch</div><div class="value" id="tilt">–</div></div>
        <div class="stat wide"><div class="label">Lifted leg</div>
          <div class="legs" id="legs"></div></div>
      </div>
      <div class="text-row"><div class="label">Command</div><div class="text" id="command">–</div></div>
      <div class="text-row"><div class="label">Result</div><div class="text" id="result">–</div></div>
    </div>
  </section>

  <section class="voice">
    <button class="big-btn" id="speak" title="Ask the voice client to listen (Space)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v1a7 7 0 0 0 14 0v-1"/><path d="M12 18v4"/></svg>
      <span>Speak<span class="hint">Space</span></span>
    </button>
    <button class="big-btn" id="stop" title="Stop the robot now (Esc)">
      <svg viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="2.5"/></svg>
      <span>Stop<span class="hint">Esc</span></span>
    </button>
    <div class="card">
      <div class="label">Voice</div>
      <div class="voice-badge" id="voice">–</div>
      <div class="voice-detail" id="voice-detail"></div>
    </div>
    <div class="card">
      <div class="label">Heard</div>
      <div class="big-text deva" id="heard">–</div>
    </div>
    <div class="card">
      <div class="label">Last reply</div>
      <div class="big-text deva" id="reply">–</div>
    </div>
  </section>
</div>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };

  // ---- formatting ---------------------------------------------------------
  function signed(v, digits) { return (v >= 0 ? "+" : "−") + Math.abs(v).toFixed(digits); }
  function metres(v) { return v == null ? "–" : signed(v, 3) + "<small> m</small>"; }
  function setText(el, text) {
    var empty = !text;
    el.textContent = empty ? "–" : text;
    el.classList.toggle("empty", empty);
  }
  function setHTML(el, html) { if (el._html !== html) { el.innerHTML = html; el._html = html; } }
  function cssKey(s) { return s.replace(/[^A-Za-z]+/g, "_"); }

  // ---- map ----------------------------------------------------------------
  var MIN_SPAN = 0.6, MARGIN = 0.15, ARROW = 0.06;
  var canvas = $("map"), ctx = canvas.getContext("2d");
  var trail = [];           // [x, y] or null (segment break)
  var limits = null;        // [x0, x1, y0, y1], grows only (no jitter)
  var last = null;          // last state message
  var css = getComputedStyle(document.documentElement);
  function color(name) { return css.getPropertyValue(name).trim(); }

  function fit(points, reset) {
    if (!points.length) return;
    var x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
    points.forEach(function (p) {
      x0 = Math.min(x0, p[0]); x1 = Math.max(x1, p[0]);
      y0 = Math.min(y0, p[1]); y1 = Math.max(y1, p[1]);
    });
    x0 -= MARGIN; x1 += MARGIN; y0 -= MARGIN; y1 += MARGIN;
    if (limits && !reset) {
      x0 = Math.min(x0, limits[0]); x1 = Math.max(x1, limits[1]);
      y0 = Math.min(y0, limits[2]); y1 = Math.max(y1, limits[3]);
    }
    if (x1 - x0 < MIN_SPAN) { var mx = (x0 + x1) / 2; x0 = mx - MIN_SPAN / 2; x1 = mx + MIN_SPAN / 2; }
    if (y1 - y0 < MIN_SPAN) { var my = (y0 + y1) / 2; y0 = my - MIN_SPAN / 2; y1 = my + MIN_SPAN / 2; }
    limits = [x0, x1, y0, y1];
  }

  function mapPoints(s) {
    var pts = trail.filter(function (p) { return p; });
    if (s && s.x != null) pts.push([s.x, s.y]);
    if (s && s.walk) pts.push(s.walk.target);
    return pts;
  }

  function niceStep(span, pixels) {
    var target = span / Math.max(4, pixels / 70);
    var steps = [0.01, 0.02, 0.05, 0.1, 0.2, 0.25, 0.5, 1, 2, 5, 10];
    for (var i = 0; i < steps.length; i++) if (steps[i] >= target) return steps[i];
    return steps[steps.length - 1];
  }

  function drawMap() {
    var dpr = window.devicePixelRatio || 1;
    var w = canvas.clientWidth, h = canvas.clientHeight;
    if (!w || !h) return;
    if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) {
      canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
    }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);

    var padL = 52, padB = 34, padT = 8, padR = 10;
    var pw = w - padL - padR, ph = h - padT - padB;
    var lim = limits || [-MIN_SPAN / 2, MIN_SPAN / 2, -MIN_SPAN / 2, MIN_SPAN / 2];
    var sx = lim[1] - lim[0], sy = lim[3] - lim[2];
    var scale = Math.min(pw / sx, ph / sy);              // px per m, equal aspect
    var cx = (lim[0] + lim[1]) / 2, cy = (lim[2] + lim[3]) / 2;
    var ox = padL + pw / 2, oy = padT + ph / 2;
    function X(x) { return ox + (x - cx) * scale; }
    function Y(y) { return oy - (y - cy) * scale; }
    var vx0 = cx - pw / 2 / scale, vx1 = cx + pw / 2 / scale;
    var vy0 = cy - ph / 2 / scale, vy1 = cy + ph / 2 / scale;

    // grid + axis labels
    var step = niceStep(Math.max(vx1 - vx0, vy1 - vy0), Math.max(pw, ph));
    var digits = step < 0.1 ? 2 : (step < 1 ? 1 : 0);
    ctx.lineWidth = 1;
    ctx.font = "13px " + color("--mono");
    ctx.fillStyle = color("--muted");
    ctx.textAlign = "center"; ctx.textBaseline = "top";
    for (var gx = Math.ceil(vx0 / step) * step; gx <= vx1 + 1e-9; gx += step) {
      var zero = Math.abs(gx) < step / 2;
      ctx.strokeStyle = color(zero ? "--grid-strong" : "--grid");
      ctx.beginPath(); ctx.moveTo(X(gx), padT); ctx.lineTo(X(gx), padT + ph); ctx.stroke();
      ctx.fillText((Math.abs(gx) < 1e-9 ? 0 : gx).toFixed(digits), X(gx), padT + ph + 6);
    }
    ctx.textAlign = "right"; ctx.textBaseline = "middle";
    for (var gy = Math.ceil(vy0 / step) * step; gy <= vy1 + 1e-9; gy += step) {
      var zeroY = Math.abs(gy) < step / 2;
      ctx.strokeStyle = color(zeroY ? "--grid-strong" : "--grid");
      ctx.beginPath(); ctx.moveTo(padL, Y(gy)); ctx.lineTo(padL + pw, Y(gy)); ctx.stroke();
      ctx.fillText((Math.abs(gy) < 1e-9 ? 0 : gy).toFixed(digits), padL - 8, Y(gy));
    }
    ctx.fillStyle = color("--faint");
    ctx.textAlign = "right"; ctx.textBaseline = "bottom";
    ctx.fillText("x (m) →", padL + pw, padT + ph - 4);
    ctx.save(); ctx.translate(padL + 16, padT + 6); ctx.textAlign = "left"; ctx.textBaseline = "top";
    ctx.fillText("↑ y (m)", 0, 0); ctx.restore();

    var s = last;
    // path trail
    ctx.strokeStyle = color("--path"); ctx.lineWidth = 3; ctx.lineJoin = "round"; ctx.lineCap = "round";
    ctx.beginPath();
    var pen = false;
    trail.forEach(function (p) {
      if (!p) { pen = false; return; }
      if (pen) ctx.lineTo(X(p[0]), Y(p[1])); else { ctx.moveTo(X(p[0]), Y(p[1])); pen = true; }
    });
    ctx.stroke();

    if (s && s.start) {     // start point
      ctx.fillStyle = color("--green");
      ctx.beginPath(); ctx.arc(X(s.start[0]), Y(s.start[1]), 8, 0, 2 * Math.PI); ctx.fill();
    }
    if (s && s.walk) {      // running walk: start square, dashed line, target X
      var a = s.walk.start, t = s.walk.target, P = color("--purple");
      ctx.strokeStyle = P; ctx.lineWidth = 2;
      ctx.setLineDash([8, 6]);
      ctx.beginPath(); ctx.moveTo(X(a[0]), Y(a[1])); ctx.lineTo(X(t[0]), Y(t[1])); ctx.stroke();
      ctx.setLineDash([]);
      ctx.strokeRect(X(a[0]) - 6, Y(a[1]) - 6, 12, 12);
      ctx.lineWidth = 4; var k = 10;
      ctx.beginPath();
      ctx.moveTo(X(t[0]) - k, Y(t[1]) - k); ctx.lineTo(X(t[0]) + k, Y(t[1]) + k);
      ctx.moveTo(X(t[0]) + k, Y(t[1]) - k); ctx.lineTo(X(t[0]) - k, Y(t[1]) + k);
      ctx.stroke();
    }
    if (s && s.x != null) { // Gurdy + heading arrow
      var rx = X(s.x), ry = Y(s.y), yaw = s.yaw_deg * Math.PI / 180;
      var len = Math.max(ARROW * scale, 34);
      var hx = rx + len * Math.cos(yaw), hy = ry - len * Math.sin(yaw);
      var R = color("--red");
      ctx.strokeStyle = R; ctx.fillStyle = R; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(rx, ry); ctx.lineTo(hx, hy); ctx.stroke();
      var head = 12, ang = Math.atan2(hy - ry, hx - rx);
      ctx.beginPath(); ctx.moveTo(hx + head * Math.cos(ang), hy + head * Math.sin(ang));
      ctx.lineTo(hx + head * Math.cos(ang + 2.4), hy + head * Math.sin(ang + 2.4));
      ctx.lineTo(hx + head * Math.cos(ang - 2.4), hy + head * Math.sin(ang - 2.4));
      ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.arc(rx, ry, 11, 0, 2 * Math.PI); ctx.fill();
      ctx.strokeStyle = "#fff"; ctx.lineWidth = 2.5; ctx.stroke();
    } else {
      ctx.fillStyle = color("--muted"); ctx.font = "18px " + color("--font");
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText("waiting for /gurdy/odom", padL + pw / 2, padT + ph / 2);
    }

    // legend
    var items = [["--path", "path", "line"], ["--green", "start", "dot"],
                 ["--purple", "target", "x"], ["--red", "Gurdy", "dot"]];
    ctx.font = "14px " + color("--font"); ctx.textAlign = "left"; ctx.textBaseline = "middle";
    var lx = padL + 12, ly = padT + 34;
    ctx.fillStyle = "rgba(10,14,22,.78)";
    ctx.fillRect(lx - 8, ly - 14, 104, items.length * 22 + 6);
    items.forEach(function (it, i) {
      var yy = ly + i * 22, c = color(it[0]);
      ctx.strokeStyle = c; ctx.fillStyle = c; ctx.lineWidth = 3;
      if (it[2] === "line") { ctx.beginPath(); ctx.moveTo(lx, yy); ctx.lineTo(lx + 18, yy); ctx.stroke(); }
      else if (it[2] === "dot") { ctx.beginPath(); ctx.arc(lx + 9, yy, 6, 0, 2 * Math.PI); ctx.fill(); }
      else { ctx.beginPath(); ctx.moveTo(lx + 4, yy - 5); ctx.lineTo(lx + 14, yy + 5);
             ctx.moveTo(lx + 14, yy - 5); ctx.lineTo(lx + 4, yy + 5); ctx.stroke(); }
      ctx.fillStyle = color("--text"); ctx.fillText(it[1], lx + 28, yy);
    });
  }
  new ResizeObserver(drawMap).observe(canvas);
  $("fit").addEventListener("click", function () { fit(mapPoints(last), true); drawMap(); });

  // ---- panel --------------------------------------------------------------
  var legs = $("legs");
  for (var i = 1; i <= 6; i++) {
    var d = document.createElement("div"); d.className = "leg"; d.textContent = i; legs.appendChild(d);
  }

  function render(s) {
    $("simtime").textContent = "sim t = " + (s.time == null ? "–" : s.time.toFixed(1) + " s");
    var st = $("status");
    st.textContent = s.status; st.className = "status-badge s-" + s.status;
    setHTML($("x"), metres(s.x));
    setHTML($("y"), metres(s.y));
    setHTML($("heading"), s.yaw_deg == null ? "–" : signed(s.yaw_deg, 1) + "°");
    setText($("mode"), s.mode === "-" ? "" : s.mode);
    if (s.progress && s.progress[1] != null) {
      setHTML($("walk"), s.progress[0].toFixed(3) + " <small>/ " + s.progress[1].toFixed(3) + " m</small>");
      $("walk-bar").style.width = Math.max(0, Math.min(100, 100 * s.progress[0] / (s.progress[1] || 1))) + "%";
    } else if (s.progress) {
      setHTML($("walk"), s.progress[0].toFixed(3) + "<small> m</small>");
      $("walk-bar").style.width = "0";
    } else {
      setHTML($("walk"), "–"); $("walk-bar").style.width = "0";
    }
    setHTML($("total"), s.total_m == null ? "–" : s.total_m.toFixed(3) + "<small> m</small>");
    setHTML($("height"), s.z == null ? "–" : s.z.toFixed(3) + "<small> m</small>");
    setHTML($("tilt"), s.roll_deg == null ? "–" :
      signed(s.roll_deg, 1) + "° / " + signed(s.pitch_deg, 1) + "°");
    Array.prototype.forEach.call(legs.children, function (el, i) {
      el.classList.toggle("up", !!(s.lifted && s.lifted.indexOf(i + 1) >= 0));
    });
    setText($("command"), s.command);
    setText($("result"), s.result);
    setText($("heard"), s.heard);
    setText($("reply"), s.voice.reply);
    var vb = $("voice");
    vb.textContent = s.voice.label; vb.className = "voice-badge v-" + cssKey(s.voice.label);
    $("voice-detail").textContent = s.voice.detail || "";

    $("cam-wait").classList.toggle("hidden", s.camera_age != null);
    $("cam-stale").classList.toggle("hidden", s.camera_age == null || !s.camera_stale);
  }

  // ---- live data (Server-Sent Events) -------------------------------------
  var conn = $("conn");
  function setConn(ok) {
    conn.className = "pill " + (ok ? "live" : "down");
    $("conn-text").textContent = ok ? "live" : "reconnecting…";
  }
  var es = new EventSource("events");
  es.onopen = function () { setConn(true); };
  es.onerror = function () { setConn(false); };
  es.onmessage = function (e) {
    var s = JSON.parse(e.data);
    if (s.trail_from === 0) { trail = []; }
    if (s.trail_from === trail.length) trail = trail.concat(s.trail);
    last = s;
    fit(mapPoints(s), false);
    render(s);
    drawMap();
    setConn(true);
  };

  // ---- camera (MJPEG) -----------------------------------------------------
  var cam = $("cam");
  function startCam() { cam.src = "camera.mjpg?t=" + Date.now(); }
  cam.onerror = function () { setTimeout(startCam, 2000); };
  startCam();

  // ---- buttons ------------------------------------------------------------
  function press(btn, url) {
    btn.classList.add("pressed");
    setTimeout(function () { btn.classList.remove("pressed"); }, 150);
    fetch(url, { method: "POST" }).catch(function () { setConn(false); });
  }
  $("speak").addEventListener("click", function () { press(this, "api/speak"); });
  $("stop").addEventListener("click", function () { press(this, "api/stop"); });
  document.addEventListener("keydown", function (e) {
    if (e.repeat || e.ctrlKey || e.altKey || e.metaKey) return;
    if (e.code === "Space") { e.preventDefault(); press($("speak"), "api/speak"); }
    else if (e.code === "Escape") { e.preventDefault(); press($("stop"), "api/stop"); }
  });
  // Space on a focused button would also click it: keep focus off the buttons
  document.querySelectorAll(".big-btn").forEach(function (b) {
    b.addEventListener("mouseup", function () { b.blur(); });
  });
})();
</script>
</body>
</html>
